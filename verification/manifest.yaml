repository:
  url: "https://github.com/systemslibrarian/crypto-lab-ring-sign"
  default_branch: "main"
  commit_sha: "77f9107d12c45880d90436c0901554fd523cd82a"

scope_map:
  files:
    - path: "src/ring.ts"
      role: "math_core"
      note: "LSAG signature arithmetic and logic"
    - path: "src/group.ts"
      role: "math_core"
      note: "Group manager and signature logic"
    - path: "src/main.ts"
      role: "ui"
      note: "DOM manipulation and app entry point"
    - path: "src/style.css"
      role: "ui"
      note: "CSS styles"
    - path: "src/ring.test.ts"
      role: "test"
      note: "Tests for LSAG"
    - path: "src/group.test.ts"
      role: "test"
      note: "Tests for Group signatures"
    - path: "playwright.config.ts"
      role: "test"
      note: "E2E tests config"
    - path: "vite.config.ts"
      role: "ui"
      note: "Build config"
  entry_points:
    - "src/main.ts"
  extraction_order:
    - "src/ring.ts"
    - "src/group.ts"
  red_flags:
    - "Group signatures in group.ts carry a stable credentialId and memberPublicJwk in the clear, making them trivially linkable by any verifier, violating the core anonymity property of group signatures."
  scope_amendments: []

